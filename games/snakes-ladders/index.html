<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Snakes &amp; Ladders — Neon Jungle</title>
<style>
:root{
  --text:#eef0fa;--dim:#98a0c3;--panel:rgba(23,27,46,.92);--line:rgba(255,255,255,.09);
  --accent:#7c5cff;--accent2:#00d4a6;--board:400px;--cell:40px;--piece:18px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(900px 600px at 18% -10%, rgba(124,92,255,.26), transparent 60%),
    radial-gradient(850px 650px at 85% 112%, rgba(0,212,166,.20), transparent 55%),
    radial-gradient(600px 400px at 50% 115%, rgba(40,255,120,.10), transparent 60%),
    #08110c;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
/* ---------- ambience ---------- */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star-layer{position:absolute;inset:-550px 0 0 0;background-repeat:repeat;animation:starFall linear infinite}
@keyframes starFall{to{transform:translateY(550px)}}
.l1{background-image:
  radial-gradient(1.4px 1.4px at 23px 61px,#fff,transparent 100%),
  radial-gradient(1.6px 1.6px at 120px 160px,rgba(255,255,255,.85),transparent 100%),
  radial-gradient(1.3px 1.3px at 210px 40px,rgba(255,255,255,.7),transparent 100%),
  radial-gradient(1.8px 1.8px at 300px 220px,rgba(255,255,255,.9),transparent 100%),
  radial-gradient(1.4px 1.4px at 390px 300px,rgba(255,255,255,.65),transparent 100%),
  radial-gradient(1.6px 1.6px at 80px 330px,rgba(255,255,255,.8),transparent 100%),
  radial-gradient(1.5px 1.5px at 460px 120px,rgba(255,255,255,.75),transparent 100%);
  background-size:520px 550px;animation-duration:150s;opacity:.5}
.l2{background-image:
  radial-gradient(2px 2px at 60px 100px,#cfe0ff,transparent 100%),
  radial-gradient(2.2px 2.2px at 250px 240px,rgba(180,200,255,.8),transparent 100%),
  radial-gradient(2px 2px at 420px 60px,rgba(255,255,255,.7),transparent 100%);
  background-size:550px 550px;animation-duration:95s;opacity:.35}
.firefly{position:fixed;width:5px;height:5px;border-radius:50%;z-index:0;pointer-events:none;
  background:radial-gradient(circle,#d8ff9e,rgba(190,255,120,.0) 70%);
  box-shadow:0 0 10px 3px rgba(190,255,120,.35);opacity:.5;
  animation:ffly var(--fd,11s) ease-in-out infinite alternate}
@keyframes ffly{
  0%{transform:translate(0,0)}
  30%{transform:translate(var(--fx1,40px),var(--fy1,-30px))}
  60%{transform:translate(var(--fx2,-25px),var(--fy2,25px))}
  100%{transform:translate(var(--fx3,15px),var(--fy3,-15px))}
}
/* ---------- layout ---------- */
#stage{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;padding:10px}
.title{margin:0;font-size:1.55rem;letter-spacing:.5px;line-height:1.1;text-align:center;
  background:linear-gradient(90deg,#8effa9 0%,#00d4a6 45%,#7c5cff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.title small{font-size:.62em;letter-spacing:.28em;color:var(--dim);-webkit-text-fill-color:var(--dim)}
/* ---------- HUD ---------- */
#hud{display:flex;align-items:stretch;gap:10px;padding:8px 12px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 12px 34px rgba(0,0,0,.45)}
.pcard{min-width:118px;display:flex;flex-direction:column;justify-content:center;gap:3px;
  padding:6px 12px;border-radius:10px;border:1px solid transparent;position:relative;
  transition:box-shadow .25s,transform .25s,opacity .25s;opacity:.75}
.pcard.active{opacity:1;transform:translateY(-1px)}
.pcard .pname{font-size:.78rem;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pcard .pdot{width:9px;height:9px;border-radius:50%;background:var(--pc);box-shadow:0 0 8px var(--pc)}
.pcard .prow{display:flex;align-items:center;gap:8px;font-size:.72rem}
.pcard .crons{font-size:.78rem;letter-spacing:1px;filter:grayscale(1);opacity:.35}
.pcard .crons .on{filter:none;opacity:1;text-shadow:0 0 8px rgba(255,209,102,.8)}
.pcard .pts{color:#ffd166;font-variant-numeric:tabular-nums}
.pcard .tile{color:var(--dim);font-size:.66rem}
.pcard .zzz{position:absolute;right:8px;top:-4px;font-size:.85rem;animation:zfloat 1.2s ease-in-out infinite;display:none}
.pcard.nap .zzz{display:block}
@keyframes zfloat{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-4px);opacity:1}}
/* ---------- dice ---------- */
#dieArea{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:118px}
.die-scene{width:var(--diesize,84px);height:var(--diesize,84px);perspective:620px;cursor:pointer;
  animation:dieBob 3.2s ease-in-out infinite alternate}
@keyframes dieBob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.die-scene.dim{opacity:.45;cursor:default}
.die-cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;
  transition:transform .95s cubic-bezier(.32,1.18,.42,1);
  transform:rotateX(-24deg) rotateY(38deg)}
.die-scene.rolling .die-cube{transition:transform .95s cubic-bezier(.3,.9,.38,1.04)}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;
  background:linear-gradient(135deg,#303560,#181c36 70%);
  border:1px solid rgba(160,190,255,.28);
  box-shadow:inset 0 0 18px rgba(0,0,0,.55);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:19%;
  transform:rotateX(var(--fxr,0deg)) rotateY(var(--fyr,0deg)) translateZ(var(--half,42px))}
.face .pip{place-self:center;width:100%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fff,#9fe8ff 55%,#3fa9ff);
  box-shadow:0 0 6px rgba(140,220,255,.8);opacity:0}
.face .pip.on{opacity:1}
.die-label{font-size:.68rem;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;text-align:center;min-height:1em}
.die-label.hot{color:#8effa9;text-shadow:0 0 10px rgba(120,255,150,.5)}
/* ---------- board ---------- */
#board{position:relative;border-radius:16px;
  background:linear-gradient(160deg,#0d2417,#101b2e 55%,#1a1030);
  border:1px solid rgba(140,255,180,.16);
  box-shadow:0 22px 60px rgba(0,0,0,.55),0 0 42px rgba(0,212,166,.10),inset 0 0 60px rgba(0,0,0,.5);
  overflow:hidden;touch-action:none}
#tiles{position:absolute;inset:6px;display:grid;grid-template:repeat(10,1fr)/repeat(10,1fr);gap:2px;z-index:1}
.tile{position:relative;border-radius:3px;background:rgba(255,255,255,.028);
  display:flex;align-items:center;justify-content:center}
.tile.alt{background:rgba(120,220,180,.05)}
.tile .tnum{position:absolute;top:1px;left:3px;font-size:.42rem;color:rgba(255,255,255,.34);line-height:1}
.tile .ticon{font-size:.85rem;filter:drop-shadow(0 0 6px rgba(255,255,255,.35));
  animation:iconPulse 2.6s ease-in-out infinite;pointer-events:none}
.tile.goal{background:radial-gradient(circle,rgba(255,209,102,.22),rgba(255,209,102,.05));
  box-shadow:inset 0 0 14px rgba(255,209,102,.25)}
.tile.goal .ticon{font-size:1.1rem;animation:crownPulse 1.8s ease-in-out infinite}
.tile.start{background:radial-gradient(circle,rgba(0,212,166,.20),rgba(0,212,166,.04));
  box-shadow:inset 0 0 14px rgba(0,212,166,.25)}
.tile.start .tlabel{font-size:.5rem;font-weight:800;letter-spacing:.14em;color:#7dffd9}
@keyframes iconPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes crownPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 5px rgba(255,209,102,.6))}50%{transform:scale(1.22);filter:drop-shadow(0 0 12px rgba(255,209,102,.95))}}
#creatures{position:absolute;inset:0;z-index:2;pointer-events:none;transform-origin:0 0}
#fx{position:absolute;inset:0;z-index:3;pointer-events:none}
/* creature styles (SVG) */
.snake-body{stroke-linecap:round;fill:none}
.snake-shimmer{fill:none;stroke:rgba(230,255,200,.5);stroke-linecap:round;
  stroke-dasharray:13 59;animation:shimmer 2.8s linear infinite}
@keyframes shimmer{to{stroke-dashoffset:-72}}
.snake.tense .snake-shimmer{animation-duration:.5s}
.snake.tense .snake-body{filter:drop-shadow(0 0 6px rgba(140,255,120,.8))}
.snake-head{filter:drop-shadow(0 0 5px rgba(120,255,140,.55))}
.tongue{transform-origin:0 0;animation:tongue 3.4s ease-in-out infinite}
@keyframes tongue{0%,64%,100%{opacity:0;transform:scale(.2)}72%,80%{opacity:1;transform:scale(1)}}
.snake.tense .tongue{animation-duration:.6s}
.ladder-glow{animation:ladGlow 3.6s ease-in-out infinite}
@keyframes ladGlow{0%,100%{opacity:.14}50%{opacity:.5}}
.ladder.boost .ladder-glow{animation-duration:.8s;opacity:.7}
.ladder.boost .lad-rail{filter:drop-shadow(0 0 7px rgba(0,255,200,.9))}
/* glint of light running up the ladder (dashes travel base→top) */
.ladder-glint{stroke:#d6ffe9;stroke-width:3;fill:none;stroke-linecap:round;
  stroke-dasharray:10 90;opacity:.5;animation:glintRun 4s linear infinite;
  filter:drop-shadow(0 0 5px rgba(125,255,206,.8))}
@keyframes glintRun{to{stroke-dashoffset:-100}}
.ladder.boost .ladder-glint{opacity:1;animation-duration:.7s;
  filter:drop-shadow(0 0 9px rgba(180,255,225,1))}
.creature{transition:opacity .45s ease,transform .45s ease}
.creature.bye{opacity:0;transform:scale(.82)}
.creature.born{opacity:0;transform:scale(.82)}
/* pieces */
.piece{position:absolute;left:0;top:0;width:var(--piece);height:var(--piece);
  z-index:4;pointer-events:none;will-change:transform}
.piece .core{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.95) 0%,var(--pc) 42%,rgba(0,0,0,.45) 130%);
  border:1.5px solid rgba(255,255,255,.55);
  box-shadow:0 0 12px var(--pc),0 3px 8px rgba(0,0,0,.5);
  animation:coreFloat 2.4s ease-in-out infinite alternate;
  transition:opacity .18s}
@keyframes coreFloat{from{transform:translateY(0) scale(1)}to{transform:translateY(-2.5px) scale(1.04)}}
.piece.hop .core{animation:hopSquash .19s ease}
@keyframes hopSquash{0%{transform:scale(1,1)}45%{transform:scale(1.35,.62)}100%{transform:scale(1,1)}}
.piece.free .core{animation:none}
.piece .core.sucked{transform:scale(.55);opacity:.85;filter:saturate(2) hue-rotate(40deg)}
.piece .core.pop{animation:popIn .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes popIn{from{transform:scale(.3)}to{transform:scale(1)}}
.piece .zpiece{position:absolute;left:50%;top:-10px;transform:translateX(-50%);font-size:.9rem;
  animation:zfloat 1.1s ease-in-out infinite;display:none}
.piece.nap .zpiece{display:block}
/* ---------- button bar ---------- */
#btnbar{display:flex;gap:8px;align-items:center}
.btn{background:rgba(124,92,255,.16);border:1px solid rgba(124,92,255,.45);color:#cbb9ff;
  padding:6px 13px;border-radius:9px;font-size:.75rem;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:background .15s,transform .1s,opacity .2s}
.btn:hover{background:rgba(124,92,255,.34)}
.btn:active{transform:scale(.95)}
.btn.dim{opacity:.4;cursor:default}
.btn.primary{background:rgba(0,212,166,.2);border-color:rgba(0,212,166,.55);color:#8effd9}
.btn.primary:hover{background:rgba(0,212,166,.38)}
/* toast */
#toast{position:fixed;top:12%;left:50%;transform:translate(-50%,-8px);z-index:1000;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 18px;
  font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  box-shadow:0 12px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* confetti */
.confetti{position:fixed;width:8px;height:8px;z-index:10001;pointer-events:none;border-radius:2px;
  animation:confettiFall 2.6s ease-in forwards}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
/* coinfly */
.coinfly{position:fixed;z-index:9999;width:16px;height:16px;margin:-8px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#fff6c8,#ffd166 55%,#a67c00);
  box-shadow:0 0 12px rgba(255,209,102,.9);
  transition:transform .72s cubic-bezier(.4,0,.6,1),opacity .72s}
/* ---------- overlay ---------- */
#overlay{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;
  background:rgba(3,8,6,.66);backdrop-filter:blur(5px)}
#overlay.show{display:flex}
#overlay .modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:30px 38px;text-align:center;max-width:min(92vw,460px);max-height:92vh;overflow:auto;
  box-shadow:0 24px 64px rgba(0,0,0,.65);animation:modalIn .3s ease}
@keyframes modalIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
#overlay h2{margin:0 0 4px;font-size:1.5rem;
  background:linear-gradient(90deg,#8effa9,#00d4a6 50%,#7c5cff);
  -webkit-background-clip:text;background-clip:text;color:transparent}
#overlay .sub{color:var(--dim);margin:0 0 14px;font-size:.85rem}
#overlay .modes{display:flex;gap:10px;justify-content:center;margin:14px 0 16px}
#overlay .modes .btn{font-size:.85rem;padding:10px 20px}
.howto{text-align:left;font-size:.78rem;color:var(--dim);line-height:1.65;
  background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.howto b{color:var(--text)}
.stat-row{display:flex;gap:18px;justify-content:center;margin:8px 0 16px;font-size:.85rem}
.stat-row .s{display:flex;flex-direction:column;gap:2px}
.stat-row .s .l{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.stat-row .s .v{font-size:1.05rem;font-weight:700}
@media(max-width:640px){
  .title{font-size:1.1rem}
  #hud{gap:6px;padding:6px 8px}
  .pcard{min-width:84px;padding:5px 8px}
  .pcard .pname{font-size:.66rem}
  .pcard .prow{font-size:.62rem;gap:5px}
  .pcard .tile{font-size:.58rem}
  #dieArea{min-width:84px}
  .btn{padding:5px 9px;font-size:.64rem}
  .tile .tnum{font-size:.34rem}
}
</style>
</head>
<body>
<div class="stars">
  <div class="star-layer l1"></div><div class="star-layer l2"></div>
  <div class="firefly" style="left:12%;top:26%;--fd:9s;--fx1:60px;--fy1:-40px;--fx2:-30px;--fy2:30px;--fx3:20px;--fy3:-18px"></div>
  <div class="firefly" style="left:82%;top:60%;--fd:13s;--fx1:-50px;--fy1:35px;--fx2:40px;--fy2:-25px;--fx3:-15px;--fy3:20px;opacity:.35"></div>
  <div class="firefly" style="left:70%;top:18%;--fd:11s;--fx1:35px;--fy1:45px;--fx2:-45px;--fy2:15px;--fx3:25px;--fy3:-30px;opacity:.4"></div>
  <div class="firefly" style="left:22%;top:72%;--fd:15s;--fx1:-40px;--fy1:-35px;--fx2:30px;--fy2:40px;--fx3:-20px;--fy3:-12px;opacity:.3"></div>
</div>
<div id="stage">
  <div class="title">Snakes &amp; Ladders <small>NEON JUNGLE</small></div>
  <div id="hud">
    <div class="pcard" id="pcard0">
      <div class="pname"><span class="pdot"></span><span id="pname0">You</span></div>
      <div class="prow"><span class="crons" id="crons0"></span><span class="pts" id="pts0">0 pts</span></div>
      <div class="tile" id="tile0">tile 1</div>
      <span class="zzz">💤</span>
    </div>
    <div id="dieArea">
      <div class="die-scene" id="dieScene" role="button" aria-label="Roll the dice" tabindex="0">
        <div class="die-cube" id="dieCube"></div>
      </div>
      <div class="die-label" id="dieLabel">tap to roll</div>
    </div>
    <div class="pcard" id="pcard1">
      <div class="pname"><span class="pdot"></span><span id="pname1">Cobra</span></div>
      <div class="prow"><span class="crons" id="crons1"></span><span class="pts" id="pts1">0 pts</span></div>
      <div class="tile" id="tile1">tile 1</div>
      <span class="zzz">💤</span>
    </div>
  </div>
  <div id="board" role="application" aria-label="Snakes and ladders board">
    <div id="tiles"></div>
    <svg id="creatures" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg>
    <canvas id="fx"></canvas>
  </div>
  <div id="btnbar">
    <button class="btn primary" id="btnRoll" type="button">🎲 Roll</button>
    <button class="btn" id="btnMute" type="button">🔊 Sound</button>
    <button class="btn" id="btnFull" type="button">⛶</button>
    <button class="btn" id="btnRestart" type="button">↻</button>
    <button class="btn" id="btnMenu" type="button">🏠</button>
  </div>
</div>
<div id="toast"></div>
<div id="overlay"><div class="modal" id="modalBox"></div></div>
<script>
(function(){
"use strict";

/*================ PURE GAME CORE — no DOM ================*/
/*__LOGIC_START__*/
var COLS=10, ROWS=10, N=100, CROWNS_TO_WIN=3;
var SPECIAL={portal:"🌀", trap:"💀", coin:"💰", bolt:"⚡"};
var SPECIAL_LABEL={portal:"portal", trap:"trap", coin:"coin", bolt:"bolt"};

/* unit space: the board is 1000x1000; tile n -> {x,y} of its centre */
function tileU(n){
  var idx=n-1, row=(idx/10)|0;
  var c=idx%10;
  if(row&1)c=9-c;
  return {x:c*100+50, y:(ROWS-1-row)*100+50};
}

/* move with classic bounce off 100; returns {path:[tiles...], final} */
function buildPath(from, roll){
  var path=[], pos=from, raw=from+roll;
  if(raw<=100){
    for(var i=0;i<roll;i++){pos++;path.push(pos);}
  }else{
    while(pos<100){pos++;path.push(pos);}
    var back=raw-100;
    for(var j=0;j<back;j++){pos--;path.push(pos);}
  }
  return {path:path, final:pos};
}

/* one board layout: 5 ladders, 4 snakes, plus wild tiles.
   Creatures are anchored one per horizontal band (bottom → top) so every
   re-weave spreads snakes & ladders evenly across the whole board instead
   of clumping them in one region. */
function genLayout(rand){
  rand=rand||Math.random;
  var L={ladders:{},snakes:{},portal:[],trap:[],coin:[],bolt:[]};
  var taken={1:true,100:true};
  function free(min,max){
    for(var i=0;i<60;i++){
      var n=min+((rand()*(max-min+1))|0);
      if(n>=1&&n<=100&&!taken[n])return n;
    }
    return -1;
  }
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){
      var j=(rand()*(i+1))|0, tmp=a[i];a[i]=a[j];a[j]=tmp;
    }
    return a;
  }
  /* five horizontal bands, bottom row → top row */
  var bands=[[2,20],[21,40],[41,60],[61,80],[81,99]];
  var s,e,h,t,placed,guard;
  /* ladders: one base per band, climbing 10..33 (clamped at 99) */
  var lb=shuffle(bands.slice());
  for(var li=0;li<lb.length;li++){
    placed=0;guard=0;
    while(placed<1&&guard++<300){
      s=free(lb[li][0],lb[li][1]); if(s<0)continue;
      e=s+Math.min(10+((rand()*24)|0),99-s);
      if(e-s<8||e>99||taken[e])continue;
      taken[s]=true;taken[e]=true;L.ladders[s]=e;placed++;
    }
  }
  /* snakes: one head per band (upper four bands), falling 10..34 (clamped at 2) */
  var sb=shuffle(bands.slice(1));
  for(var si=0;si<sb.length;si++){
    placed=0;guard=0;
    while(placed<1&&guard++<300){
      h=free(sb[si][0],sb[si][1]); if(h<0)continue;
      t=h-Math.min(10+((rand()*24)|0),h-2);
      if(h-t<8||t<2||taken[t])continue;
      taken[h]=true;taken[t]=true;L.snakes[h]=t;placed++;
    }
  }
  /* wild tiles: placed in the least-loaded band (creature endpoints count
     toward the load) so the special icons spread across the board too */
  function bandOf(n){
    for(var bi=0;bi<bands.length;bi++)
      if(n>=bands[bi][0]&&n<=bands[bi][1])return bi;
    return 0;
  }
  var load=[0,0,0,0,0];
  for(s in L.ladders){load[bandOf(+s)]++;load[bandOf(L.ladders[s])]++;}
  for(h in L.snakes){load[bandOf(+h)]++;load[bandOf(L.snakes[h])]++;}
  var kinds=[["portal",3],["trap",2],["coin",3],["bolt",3]];
  for(var k=0;k<kinds.length;k++){
    var arr=[];
    for(var i2=0;i2<kinds[k][1];i2++){
      var n=-1, guard2=0, miss=0, b=-1;
      while(n<0&&guard2++<300){
        if(miss>0&&miss%4===3)b=((rand()*bands.length)|0);
        else{b=0;for(var bi2=1;bi2<bands.length;bi2++)if(load[bi2]<load[b])b=bi2;}
        n=free(bands[b][0],bands[b][1]);
        if(n<0)miss++;
      }
      if(n>0){arr.push(n);taken[n]=true;load[bandOf(n)]++;}  // reserve immediately: no two wild tiles may share a square
    }
    L[kinds[k][0]]=arr;
  }
  return L;
}

/* what happens when a piece sits on tile n? */
function effectAt(n, layout){
  if(layout.ladders[n])return {type:"ladder",from:n,to:layout.ladders[n]};
  if(layout.snakes[n])return {type:"snake", from:n,to:layout.snakes[n]};
  if(layout.portal.indexOf(n)>=0)return {type:"portal",from:n,to:null};
  if(layout.trap.indexOf(n)>=0)return {type:"trap",  from:n,to:null};
  if(layout.coin.indexOf(n)>=0)return {type:"coin",  from:n,to:null};
  if(layout.bolt.indexOf(n)>=0)return {type:"bolt",  from:n,to:null};
  return null;
}

/* resolve the whole chain after a landing: ordered events + final tile.
   ladders/snakes/portal relocate the piece; trap/coin/bolt are terminal.
   crowns: landing exactly on 100 emits a crown event and resets to 1. */
function resolveLanding(n, layout, rand){
  rand=rand||Math.random;
  var events=[], cur=n, chained=0, visited={};
  while(chained<6){
    if(cur===100){events.push({type:"crown",from:cur,to:1});cur=1;break;}
    var e=effectAt(cur,layout);
    if(!e||visited[e.from])break;
    visited[e.from]=true;
    if(e.type==="portal"){
      var t;
      do{t=2+((rand()*98)|0);}while(t===100||t===cur);
      e.to=t; events.push(e); cur=t;
    }else if(e.type==="ladder"||e.type==="snake"){
      events.push(e); cur=e.to;
    }else{
      events.push(e); break;                 // trap / coin / bolt: no relocation
    }
    chained++;
  }
  return {events:events, final:cur};
}

/* arc-length parameterised track through a point list (unit space) */
function makeTrack(pts){
  var cum=[0];
  for(var i=1;i<pts.length;i++)
    cum.push(cum[i-1]+Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y));
  var len=cum[cum.length-1]||1;
  function pointAt(t){
    var d=Math.max(0,Math.min(1,t))*len, i=1;
    while(i<cum.length&&cum[i]<d)i++;
    if(i>=cum.length)i=cum.length-1;
    var seg=cum[i]-cum[i-1]||1, s=(d-cum[i-1])/seg;
    return {x:pts[i-1].x+(pts[i].x-pts[i-1].x)*s,
            y:pts[i-1].y+(pts[i].y-pts[i-1].y)*s};
  }
  return {pointAt:pointAt, length:len, pts:pts};
}
/*__LOGIC_END__*/

/*================ CREATURE GEOMETRY (unit space, for the SVG + tweens) ================*/
function snakePoints(h,t,phase){
  var a=tileU(h), b=tileU(t);
  var dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
  var px=-dy/len, py=dx/len;
  var amp=Math.min(60,Math.max(16,len*0.18));
  var pts=[a], seg=8;
  for(var i=1;i<seg;i++){
    var s=i/seg;
    var wob=Math.sin(s*Math.PI*2+phase)*amp*Math.sin(s*Math.PI);
    pts.push({x:a.x+dx*s+px*wob, y:a.y+dy*s+py*wob});
  }
  pts.push(b);
  return pts;
}
function catmullSegs(pts){
  var segs=[];
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    segs.push({x1:p1.x,y1:p1.y,
      c1x:p1.x+(p2.x-p0.x)/6, c1y:p1.y+(p2.y-p0.y)/6,
      c2x:p2.x-(p3.x-p1.x)/6, c2y:p2.y-(p3.y-p1.y)/6,
      x2:p2.x,y2:p2.y});
  }
  return segs;
}
function segPoint(s,t){
  var m=1-t;
  return {x:m*m*m*s.x1+3*m*m*t*s.c1x+3*m*t*t*s.c2x+t*t*t*s.x2,
          y:m*m*m*s.y1+3*m*m*t*s.c1y+3*m*t*t*s.c2y+t*t*t*s.y2};
}
function denseFromSegs(segs,per){
  var pts=[];
  segs.forEach(function(s,i){
    for(var k=(i===0?0:1);k<=per;k++)pts.push(segPoint(s,k/per));
  });
  return pts;
}
function pathD(segs){
  var d="M "+segs[0].x1.toFixed(1)+" "+segs[0].y1.toFixed(1);
  segs.forEach(function(s){
    d+=" C "+s.c1x.toFixed(1)+" "+s.c1y.toFixed(1)+" "+s.c2x.toFixed(1)+" "+s.c2y.toFixed(1)+" "+s.x2.toFixed(1)+" "+s.y2.toFixed(1);
  });
  return d;
}
/* snake: head tile h -> tail tile t */
function snakeGeo(h,t,phase){
  var pts=snakePoints(h,t,phase);
  var segs=catmullSegs(pts);
  var a=tileU(h), b=tileU(t);
  var dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
  var nx=-dy/len, ny=dx/len;                      // head faces away from body
  var ang=Math.atan2(ny,nx)*180/Math.PI;
  return {d:pathD(segs), track:makeTrack(denseFromSegs(segs,12)),
          head:{x:a.x,y:a.y}, ang:ang,
          headTile:h, tailTile:t};
}
/* ladder: base tile s -> top tile e, slightly bowed */
function ladderGeo(s,e,bowSign){
  var a=tileU(s), b=tileU(e);
  var dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
  var mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  var nx=-(b.y-a.y)/len, ny=(b.x-a.x)/len;
  var c={x:mx+nx*len*0.13*bowSign, y:my+ny*len*0.13*bowSign};
  function q(t){var m=1-t;
    return {x:m*m*a.x+2*m*t*c.x+t*t*b.x, y:m*m*a.y+2*m*t*c.y+t*t*b.y};}
  function qn(t){var m=1-t;
    var tx=2*m*(c.x-a.x)+2*t*(b.x-c.x), ty=2*m*(c.y-a.y)+2*t*(b.y-c.y);
    var tl=Math.hypot(tx,ty)||1;
    return {x:-ty/tl, y:tx/tl};}
  var off=Math.max(9,Math.min(20,len*0.05));
  var railL=[],railR=[],rungs=[],dense=[];
  var steps=22;
  for(var i=0;i<=steps;i++){
    var t=i/steps,p=q(t),n=qn(t);
    railL.push({x:p.x-n.x*off,y:p.y-n.y*off});
    railR.push({x:p.x+n.x*off,y:p.y+n.y*off});
  }
  var rc=Math.max(4,Math.round(len/52));
  for(var r=1;r<rc;r++){
    var t2=r/rc,p2=q(t2),n2=qn(t2);
    rungs.push({x1:p2.x-n2.x*off,y1:p2.y-n2.y*off,x2:p2.x+n2.x*off,y2:p2.y+n2.y*off});
  }
  for(var i2=0;i2<=40;i2++)dense.push(q(i2/40));
  function polyD(pts){
    var d="M "+pts[0].x.toFixed(1)+" "+pts[0].y.toFixed(1);
    for(var k=1;k<pts.length;k++)d+=" L "+pts[k].x.toFixed(1)+" "+pts[k].y.toFixed(1);
    return d;
  }
  var centerD="M "+dense[0].x.toFixed(1)+" "+dense[0].y.toFixed(1);
  for(var i4=1;i4<dense.length;i4++)centerD+=" L "+dense[i4].x.toFixed(1)+" "+dense[i4].y.toFixed(1);
  return {railL:polyD(railL),railR:polyD(railR),rungs:rungs,centerD:centerD,
          track:makeTrack(dense), off:off, a:a, b:b};
}

/*================ AUDIO — Web Audio, all synthesized ================*/
var SFX=(function(){
  var ac=null, noiseBuf=null, muted=false;
  try{muted=localStorage.getItem("sl-mute")==="1";}catch(e){}
  function ctx(){
    if(muted)return null;
    if(!ac){
      try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}
      try{
        noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
        var d=noiseBuf.getChannelData(0);
        for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      }catch(e){noiseBuf=null;}
    }
    if(ac.state==="suspended")ac.resume();
    return ac;
  }
  function tone(f,dur,type,vol,delay,slide){
    var a=ctx();if(!a)return;
    type=type||"sine";vol=vol==null?0.1:vol;delay=delay||0;slide=slide||0;
    var t0=a.currentTime+delay;
    var o=a.createOscillator(),g=a.createGain();
    o.type=type;
    o.frequency.setValueAtTime(Math.max(30,f),t0);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol,t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(a.destination);
    o.start(t0);o.stop(t0+dur+0.06);
  }
  function noiseBurst(dur,vol,f0,f1,delay,type){
    var a=ctx();if(!a||!noiseBuf)return;
    var t0=a.currentTime+(delay||0);
    var src=a.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    var flt=a.createBiquadFilter();flt.type=type||"bandpass";flt.Q.value=6;
    flt.frequency.setValueAtTime(Math.max(40,f0),t0);
    if(f1)flt.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t0+dur);
    var g=a.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    src.connect(flt);flt.connect(g);g.connect(a.destination);
    src.start(t0);src.stop(t0+dur+0.05);
  }
  /* ambient jungle: soft wind + sparse firefly chimes (very quiet) */
  var amb=null;
  function startAmb(){
    if(amb||muted)return;
    var a=ctx(); if(!a||!noiseBuf)return;
    var g=a.createGain(); g.gain.value=0.011; g.connect(a.destination);
    var src=a.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    var flt=a.createBiquadFilter(); flt.type="lowpass"; flt.frequency.value=320; flt.Q.value=0.5;
    src.connect(flt); flt.connect(g); src.start();
    var lfo=a.createOscillator(); lfo.frequency.value=0.06;
    var lg=a.createGain(); lg.gain.value=0.006;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
    var notes=[392,440,523.25,587.33,659.25,784];
    var timer=setInterval(function(){
      if(muted){stopAmb();return;}
      if(!ctx())return;
      tone(notes[(Math.random()*notes.length)|0],2.4,"sine",0.015,Math.random()*0.5);
    },5600);
    amb={gain:g,src:src,lfo:lfo,timer:timer};
  }
  function stopAmb(){
    if(!amb)return;
    try{amb.src.stop();amb.lfo.stop();}catch(e){}
    try{amb.gain.disconnect();}catch(e){}
    clearInterval(amb.timer); amb=null;
  }
  return {
    get muted(){return muted;},
    get ambient(){return !!amb;},
    startAmb:startAmb,
    stopAmb:stopAmb,
    toggle(){
      muted=!muted;
      try{localStorage.setItem("sl-mute",muted?"1":"0");}catch(e){}
      if(muted)stopAmb();else{startAmb();tone(660,0.08,"triangle",0.1);}
    },
    unlock(){if(ctx())startAmb();},
    click:function(){tone(520,0.05,"triangle",0.05);},
    roll:function(){
      for(var i=0;i<5;i++)noiseBurst(0.045,0.11,2300,1200,i*0.085);
      tone(120,0.09,"sine",0.1,0.46);
    },
    hop:function(){tone(430+Math.random()*260,0.07,"triangle",0.045,0,140);},
    ladder:function(){
      [440,554,659,880].forEach(function(f,i){tone(f,0.13,"triangle",0.085,i*0.07);});
      noiseBurst(0.5,0.03,900,2600,0.1,"highpass");
    },
    snake:function(){
      tone(720,0.55,"sawtooth",0.06,0,-520);
      noiseBurst(0.55,0.05,3200,700,0.02);
      tone(180,0.4,"sine",0.07,0.3,-60);
    },
    portal:function(){
      tone(220,0.45,"sine",0.09,0,700);
      noiseBurst(0.45,0.04,500,3200,0.05,"bandpass");
    },
    coin:function(){tone(988,0.1,"sine",0.1);tone(1319,0.28,"sine",0.08,0.07);},
    trap:function(){tone(98,0.42,"square",0.06);tone(82,0.42,"square",0.045,0.05);},
    bolt:function(){tone(1900,0.26,"sawtooth",0.07,0,-1400);tone(2500,0.09,"square",0.035,0.02);},
    skip:function(){tone(200,0.12,"sine",0.06,0,-60);tone(158,0.15,"sine",0.05,0.13);},
    crown:function(){
      [523,659,784,1047].forEach(function(f,i){tone(f,0.2,"triangle",0.12,i*0.1);});
      tone(1568,0.5,"triangle",0.1,0.42);
    },
    reweave:function(){
      [262,330,392,523].forEach(function(f,i){tone(f,0.32,"sine",0.06,i*0.05);});
      noiseBurst(0.7,0.045,300,2200,0.05);
    },
    win:function(){
      [523,659,784,1047,784,1047,1319,1568].forEach(function(f,i){tone(f,0.22,"triangle",0.11,i*0.11);});
    },
    lose:function(){[392,311,262,196].forEach(function(f,i){tone(f,0.3,"sawtooth",0.05,i*0.15);});}
  };
})();

  /* the grid fills left→right, top→bottom, but tileU() — which pieces, snakes,
     ladders and particles all use — is classic boustrophedon: tile 1 bottom-
     left, row 2 right→left, etc. Derive the tile number from each grid cell
     (inverting tileU's row/column math) so the printed numbers, GO and the
     crown sit exactly where the pieces and creature tracks expect them. */
  for(var rTop=0;rTop<ROWS;rTop++){

}

function buildPieces(){

function pieceHome(i){
  var u=tileU(S.players[i].pos);
  var off=(S.players[0].pos===S.players[1].pos)? (i===0?-0.13:0.13)*100 : 0;
  return {x:u.x+off, y:u.y};
}
/* The #tiles grid is inset 6px with a 2px cell gap, so its real cells are
   slightly smaller than a naive 10% split of the board. Map the ideal
   1000-space onto the actual grid geometry — px = u*(boardPx-10)/1000 + 5 —
   so pieces, creature tracks and particles sit exactly on their tiles. */
function unitToPx(u){
  var k=(boardPx-10)/1000;
  return {x:u.x*k+5, y:u.y*k+5};
}
/* x/y are board pixels (callers pass unitToPx output) */
function setPiecePx(i,x,y,withHop){
  var P=pieceEls[i]; if(!P)return;
  P.px=x;P.py=y;

  if(withHop&&P.mode!=="free"){
    P.el.classList.remove("hop");
    void P.el.offsetWidth;
    P.el.classList.add("hop");
  }
}
function syncPieces(instant){

    P.px=u.x;P.py=u.y;
    P.el.style.transform="translate3d("+(u.x-P.el.offsetWidth/2)+"px,"+(u.y-P.el.offsetHeight/2)+"px,0)";
    P.el.style.zIndex=(S.turn===i&&S.phase==="play")?"6":"4";
    P.el.classList.toggle("nap",S.players[i].skips>0);
  }
}

var PARTS=[], fxCtx=fxCanvas.getContext("2d");
function burst(u,o){
  o=o||{};
  var pu=unitToPx(u), x=pu.x, y=pu.y;
  var n=o.n||12, speed=o.speed||130, size=o.size||2.6, life=o.life||0.7;
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2, v=speed*(0.35+Math.random()*0.85);
    PARTS.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,age:0,life:life*(0.6+Math.random()*0.6),
      size:size*(0.6+Math.random()*0.8),color:o.color||"rgba(142,255,169,",grav:o.grav||0});
  }
}
function trailAt(x,y,color){
  PARTS.push({x:x+(Math.random()*6-3),y:y+(Math.random()*6-3),
    vx:Math.random()*14-7,vy:Math.random()*14-7,age:0,life:0.34,
    size:2.2,color:color||"rgba(0,229,176,"});
}
/* living creatures: snakes slither in place (ends stay pinned to their
   tiles, and they writhe furiously while one is sliding down them); ladders
   shed a trickle of sparkles drifting up the rails. */
function animCreatures(dt){
  var k,sg,gs,d,pp,cx,cy,speed;
  for(k in creatureGeo.snakes){
    sg=creatureGeo.snakes[k];
    if(!sg.els||!sg.els.a)continue;
    gs=sg.els.g;
    if(gs.parentNode===null)continue;
    speed=gs.classList.contains("tense")?sg.animSpeed*5.5:sg.animSpeed;
    sg.animPhase+=dt*speed;
    d=pathD(catmullSegs(snakePoints(sg.headTile,sg.tailTile,sg.animPhase)));
    sg.els.a.setAttribute("d",d);
    sg.els.b.setAttribute("d",d);
    if(sg.els.s)sg.els.s.setAttribute("d",d);
  }
  for(k in creatureGeo.ladders){
    var LG=creatureGeo.ladders[k];
    if(!LG.els||LG.els.g.parentNode===null)continue;
    if(Math.random()<dt*0.55){
      pp=unitToPx(LG.geo.track.pointAt(Math.random()));
      cx=pp.x;cy=pp.y;
      PARTS.push({x:cx+(Math.random()*12-6),y:cy+(Math.random()*8-4),
        vx:Math.random()*10-5,vy:-16-Math.random()*24,age:0,
        life:0.7+Math.random()*0.7,size:1.4+Math.random()*1.2,
        color:"rgba(190,255,225,",grav:-8});
    }
  }
}
var lastFrame=performance.now();
function fxLoop(now){
  var dt=Math.min(0.05,(now-lastFrame)/1000); lastFrame=now;
  /* physics always runs so the pool ages out and never grows unbounded,
     even where there is no 2D context (minimal DOM environments) */
  for(var i=PARTS.length-1;i>=0;i--){
    var p=PARTS[i];
    p.age+=dt;
    if(p.age>=p.life){PARTS.splice(i,1);continue;}
    p.vy+=(p.grav||0)*dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
  if(fxCanvas&&fxCtx){
    try{
      var w=boardPx,h=boardPx,dpr=window.devicePixelRatio||1;
      if(fxCanvas.width!==Math.round(w*dpr)){fxCanvas.width=Math.round(w*dpr);fxCanvas.height=Math.round(h*dpr);}
      fxCtx.setTransform(dpr,0,0,dpr,0,0);
      fxCtx.clearRect(0,0,w,h);
      for(i=0;i<PARTS.length;i++){
        p=PARTS[i];
        var a=1-p.age/p.life;
        fxCtx.globalAlpha=a;
        fxCtx.fillStyle=p.color+(a*0.9).toFixed(3)+")";
        fxCtx.beginPath();fxCtx.arc(p.x,p.y,p.size,0,Math.PI*2);fxCtx.fill();
      }
      fxCtx.globalAlpha=1;
    }catch(e){/* a transient draw glitch must never kill the rAF chain */}
  }
  try{animCreatures(dt);}catch(e){}
  requestAnimationFrame(fxLoop);
}

/*================ FLOW — async turn engine ================*/
var wait=function(ms){return new Promise(function(r){setTimeout(r,ms);});};
function ab(my){return S.gen!==my||S.phase==="over";}
/* bail-out for an aborted turn (generation bumped / game over). startGame
   and gameOver reset S.busy themselves; this redundant reset makes it
   impossible for any bail path to leave the UI stuck on "moving…". */
function bail(my){
  if(!ab(my))return false;
  S.busy=false;
  updateActionUI();
  return true;
}

function moveSteps(path,pi,my){
  var p=S.players[pi];
  function step(i){
    return new Promise(function(res){
      if(ab(my)){res();return;}
      var n=path[i];
      p.pos=n;
      var u=tileU(n), px=unitToPx(pieceHome(pi));
      setPiecePx(pi,px.x,px.y,true);
      p.pts+=1;
      SFX.hop();
      trailAt(px.x,px.y,colorToRgb(p.color));
      syncHUD();
      setTimeout(function(){res();},150);
    });
  }
  var chain=Promise.resolve();
  for(var i=0;i<path.length;i++){
    (function(idx){chain=chain.then(function(){return step(idx);});})(i);
  }
  return chain;
}
/* tween a piece along a unit-space track (ladder / snake body). Driven by
   rAF when available, but every tick re-arms a setTimeout watchdog, so in
   environments that throttle or starve rAF (backgrounded webview tab, heavy
   frame drops) the tween still completes and can never wedge the turn. */
function tweenPiece(pi,track,dur,my){
  var P=pieceEls[pi]; if(!P)return Promise.resolve(false);
  var p=S.players[pi];
  P.el.classList.add("free");
  P.el.style.zIndex="7";
  return new Promise(function(res){
    var t0=performance.now(), color=p.color, done=false, raf=0, wdt=null;
    function finish(ok){
      if(done)return; done=true;
      if(raf)try{cancelAnimationFrame(raf);}catch(e){}
      if(wdt)clearTimeout(wdt);
      P.el.classList.remove("free");
      syncPieces(true);
      res(ok);
    }
    function fr(){
      if(done)return;
      if(ab(my)){finish(false);return;}
      var t=(performance.now()-t0)/dur; if(t>1)t=1;
      var e=t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;      // easeInOutCubic
      var u=track.pointAt(e);
      var px=unitToPx(u);
      P.px=px.x;P.py=px.y;
      P.el.style.transform="translate3d("+(px.x-P.el.offsetWidth/2)+"px,"+(px.y-P.el.offsetHeight/2)+"px,0)";
      trailAt(px.x,px.y,colorToRgb(color));
      if(t>=1){finish(true);return;}
      raf=requestAnimationFrame(fr);
      if(wdt)clearTimeout(wdt);
      wdt=setTimeout(fr,150);
    }
    if(ab(my)){finish(false);return;}
    raf=requestAnimationFrame(fr);
    wdt=setTimeout(fr,150);
  });
}
function colorToRgb(hex){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return "rgba("+r+","+g+","+b+",";
}
function coinfly(pi,fromU){
  return new Promise(function(res){
    var fromPx=unitToPx(fromU);
    var r0=boardEl.getBoundingClientRect();
    var x0=r0.left+fromPx.x, y0=r0.top+fromPx.y;
    var card=pcardEls[pi];
    var r1=card.getBoundingClientRect();
    var x1=r1.left+r1.width/2, y1=r1.top+r1.height/2;
    var c=document.createElement("div");c.className="coinfly";
    c.style.left=x0+"px";c.style.top=y0+"px";
    document.body.appendChild(c);
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        c.style.transform="translate("+(x1-x0)+"px,"+(y1-y0)+"px) scale(.45)";
        c.style.opacity="0.25";
      });
    });
    setTimeout(function(){c.remove();res();},760);
  });
}
function setPieceStateClass(pi,cls,add){

async function runTurn(){
  var my=S.gen;
  if(S.phase!=="play")return;
  var pi=S.turn, p=S.players[pi];
  if(p.skips>0){
    p.skips=0;
    syncHUD();
    toast(nameOf(p)+" is napping… skips a turn 💤");
    SFX.skip();
    var P=pieceEls[pi]; if(P)P.el.classList.add("nap");
    await wait(600);
    if(bail(my))return;
    var P2=pieceEls[pi]; if(P2)P2.el.classList.remove("nap");
    /* the nap path is the one that leaves the lock stuck: the CPU reached it
       via cpuKick (busy=true) and nobody on the way out cleared it, so the
       human who receives the hand-off was permanently denied a roll. */
    S.busy=false;
    updateActionUI();
    return handOff(my);
  }
  S.busy=true;
  updateActionUI();
  await wait(260);
  if(bail(my))return;
  var r=await rollDie();
  if(bail(my))return;
  await wait(280);
  if(bail(my))return;
  var mv=buildPath(p.pos,r);
  await moveSteps(mv.path,pi,my);
  if(bail(my))return;
  p.pos=mv.final;
  var res=resolveLanding(p.pos,S.layout);
  for(var i=0;i<res.events.length;i++){
    var ev=res.events[i];
    await animateEvent(pi,ev,my);
    if(bail(my))return;
  }
  if(S.phase!=="play")return;
  // lightning reroll
  for(var j=0;j<res.events.length;j++){
    if(res.events[j].type==="bolt"){
      await wait(420); if(bail(my))return;
      var r2=await rollDie(); if(bail(my))return;
      await wait(300); if(bail(my))return;
      var mv2=buildPath(p.pos,r2);
      await moveSteps(mv2.path,pi,my);
      if(bail(my))return;
      p.pos=mv2.final;
      var res2=resolveLanding(p.pos,S.layout);
      for(var k=0;k<res2.events.length;k++){
        await animateEvent(pi,res2.events[k],my);
        if(bail(my))return;
      }
      if(S.phase!=="play")return;
    }
  }
  S.busy=false;
  updateActionUI();
  if(p.skips>0){
    handOff(my);
    return;
  }
  if(r===6){
    toast(nameOf(p)+" rolled a six — extra turn!");
    return cpuKick(my);
  }
  handOff(my);
}
/* Kick off the CPU's turn after a short "thinking" delay. While the menu
   (pause) overlay is open it re-arms instead of running, so a paused game
   never advances on its own; the next arm after it hides starts the turn. */
function cpuKick(my){
  S.busy=true;
  updateActionUI();
  wait(750).then(function(){
    if(S.gen!==my||S.phase!=="play")return;
    if(overlay.classList.contains("show")){cpuKick(my);return;}
    runTurn();
  });
}
function handOff(my){
  if(S.phase!=="play")return;
  S.turn=1-S.turn;
  S.turnCount++;
  syncHUD();
  syncPieces(true);
  var next=S.players[S.turn];
  toast(next.isCpu?"Cobra's turn":"Your turn",900);
  updateActionUI();
  if(next.isCpu&&S.phase==="play"){
    cpuKick(my);
  }
}
function updateActionUI(){
  var yourTurn=S.phase==="play"&&!S.busy&&
    (S.mode==="2p"||S.turn===0)&&!S.players[S.turn].skips;
  btnRoll.classList.toggle("dim",!(S.phase==="play"&&!S.busy&&(S.mode==="2p"||S.turn===0)));
  if(S.phase!=="play"){dieLabel.textContent="";dieLabel.classList.remove("hot");return;}
  if(S.dieRolling)return;
  if(S.mode==="cpu"&&S.turn===1){dieLabel.textContent="Cobra is thinking…";dieLabel.classList.remove("hot");}
  else if(S.busy){dieLabel.textContent="moving…";}
  else{dieLabel.textContent=S.players[S.turn].skips>0?"napping… 💤":"tap to roll";
    dieLabel.classList.toggle("hot",!S.players[S.turn].skips);}
}
function rollAllowed(){
  return S.phase==="play"&&!S.busy&&S.dieRolling===false&&(S.mode==="2p"||S.turn===0);
}
function tryRoll(){
  if(rollAllowed()){
    S.busy=true;
    SFX.click();
    runTurn();
  }
}

/*================ GAME LIFECYCLE ================*/
function startGame(mode){
  S.mode=mode;
  S.gen++;
  S.phase="play";
  S.turn=0;
  S.busy=false;
  S.turnCount=0;
  S.players=newPlayers();
  S.layout=genLayout();
  clearCreatures(false);
  buildCreatures(true);
  syncTileIcons();
  buildPieces();
  idleDie();
  dieLabel.textContent="tap to roll";
  dieLabel.classList.add("hot");
  syncHUD();
  updateActionUI();
  overlay.classList.remove("show");
  SFX.unlock();
  toast(S.mode==="cpu"?"Race Cobra to 3 crowns! 👑":"First to 3 crowns wins! 👑",2200);
}
function gameOver(winner){
  S.phase="over";
  S.busy=false;
  updateActionUI();
  var humanWin=winner&&!winner.isCpu;
  if(humanWin){
    var turns=S.turnCount+1;
    if(!S.best||turns<S.best){
      S.best=turns;
      try{localStorage.setItem("sl-best",String(turns));}catch(e){}
    }
    SFX.win();
    launchConfetti();
  }else{
    SFX.lose();
  }
  var w=winner;
  modalBox.innerHTML=
    '<h2>'+(humanWin?"You win the jungle! 🏆":(w.name+" takes the jungle!"))+'</h2>'+
    '<p class="sub">'+(humanWin?"Three crowns, champion of the neon jungle.":"The snakes had other plans…")+'</p>'+
    '<div class="stat-row">'+
      '<div class="s"><span class="l">Turns</span><span class="v">'+(S.turnCount+1)+'</span></div>'+
      '<div class="s"><span class="l">'+(S.mode==="cpu"?"Your pts":"P1 pts")+'</span><span class="v">'+S.players[0].pts+'</span></div>'+
      '<div class="s"><span class="l">'+(S.mode==="cpu"?"Cobra pts":"P2 pts")+'</span><span class="v">'+S.players[1].pts+'</span></div>'+
      (S.best?'<div class="s"><span class="l">Best</span><span class="v">'+S.best+' turns</span></div>':'')+
    '</div>'+
    '<div class="modes"><button class="btn primary" data-act="again">Play again</button>'+
    '<button class="btn" data-act="menu">Menu</button></div>';
  setTimeout(function(){overlay.classList.add("show");},650);
}
function launchConfetti(){
  var colors=["#ff3355","#ffd166","#00d4a6","#7c5cff","#38b6ff","#8effa9"];
  for(var i=0;i<70;i++){
    var c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.top="-12px";
    c.style.background=colors[(Math.random()*colors.length)|0];
    c.style.animationDelay=Math.random()*1.4+"s";
    c.style.animationDuration=(1.6+Math.random()*2)+"s";
    var s2=(5+Math.random()*8);
    c.style.width=s2+"px";c.style.height=s2+"px";
    document.body.appendChild(c);
    (function(el){setTimeout(function(){el.remove();},4600);})(c);
  }
}
function showMenu(){
  // the menu is a pause overlay: the game's phase is left untouched so
  // hiding it resumes exactly where the game was.
  updateActionUI();
  modalBox.innerHTML=
    '<h2>Snakes &amp; Ladders</h2>'+
    '<p class="sub">neon jungle · crown race</p>'+
    '<div class="modes">'+
      '<button class="btn primary" data-act="cpu">🐍 vs Cobra</button>'+
      '<button class="btn" data-act="2p">👥 2 Players</button>'+
    '</div>'+
    '<div class="howto">'+
      '🎲 <b>Roll</b> the dice (click or Space) — a <b>6</b> earns an extra turn.<br>'+
      '🪜 <b>Ladders</b> launch you up · 🐍 <b>snakes</b> drag you down.<br>'+
      '🌀 <b>Portals</b> teleport · 💀 <b>traps</b> cost a turn · 💰 <b>coins</b> +100 pts · ⚡ <b>lightning</b> lets you roll again.<br>'+
      'Land <b>exactly on 100</b> to claim a 👑 — the jungle re-weaves (new snakes &amp; ladders). '+
      '<b>First to '+(CROWNS_TO_WIN)+' crowns wins!</b> Overshooting 100 bounces you back.'+
      (S.best?'<br>🏅 Best: '+S.best+' turns':'')+
    '</div>'+
    (S.phase==="play"?'<button class="btn" data-act="resume">Hide &amp; resume</button>':'');
  overlay.classList.add("show");
}

/*================ LAYOUT / RESIZE ================*/
function layout(){
  var W=window.innerWidth, H=window.innerHeight;
  var titleEl=document.querySelector(".title");
  var hudEl=$("hud"), barEl=$("btnbar");
  var chrome=(titleEl?titleEl.offsetHeight:0)+(hudEl?hudEl.offsetHeight:0)+(barEl?barEl.offsetHeight:0)+64;
  var size=Math.max(250,Math.min(W-18,H-chrome));
  size=Math.min(size,660);
  boardPx=size;
  cellPx=size/10;
  boardEl.style.width=size+"px";
  boardEl.style.height=size+"px";
  /* the creature SVG lives in the ideal 1000-unit space; scale+shift it so
     its endpoints land exactly on the inset/gap tile grid (see unitToPx) */
  svgEl.style.transform="translate(5px,5px) scale("+((size-10)/size)+")";
  document.documentElement.style.setProperty("--board",size+"px");
  document.documentElement.style.setProperty("--cell",(size/10)+"px");
  document.documentElement.style.setProperty("--piece",Math.max(14,Math.min(30,size/10*0.46))+"px");
  document.documentElement.style.setProperty("--diesize",Math.max(54,Math.min(96,size*0.17))+"px");
  var half=parseInt(getComputedStyle(document.documentElement).getPropertyValue("--diesize"),10)/2;
  dieCube.style.setProperty("--half",half+"px");
  syncPieces(true);
}
window.addEventListener("resize",function(){layout();});

/*================ INPUT ================*/
function toggleMute(){
  SFX.toggle();
  btnMute.textContent=SFX.muted?"🔇 Muted":"🔊 Sound";
}
function toggleFull(){
  if(!document.fullscreenElement){
    (document.documentElement.requestFullscreen?document.documentElement.requestFullscreen():null);
  }else{
    document.exitFullscreen();
  }
}
document.addEventListener("pointerdown",function(){SFX.unlock();},{once:true});
document.addEventListener("keydown",function(e){
  var k=e.key;
  if(k==="m"||k==="M")toggleMute();
  else if(k==="f"||k==="F")toggleFull();
  else if(k==="Escape"||k==="h"||k==="H")showMenu();
  else if(k==="n"||k==="N"){if(S.phase!=="menu")startGame(S.mode);}
  else if(k===" "||k==="Enter"){
    e.preventDefault();
    if(overlay.classList.contains("show"))return;
    tryRoll();
  }
});
btnRoll.addEventListener("click",function(){
  if(overlay.classList.contains("show"))return;
  tryRoll();
});
dieScene.addEventListener("click",function(){
  if(overlay.classList.contains("show"))return;
  tryRoll();
});
btnMute.addEventListener("click",toggleMute);
btnFull.addEventListener("click",toggleFull);
btnRestart.addEventListener("click",function(){if(S.phase!=="menu")startGame(S.mode);});
btnMenu.addEventListener("click",showMenu);
overlay.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");
  if(!b)return;
  var act=b.dataset.act;
  SFX.click();
  if(act==="cpu")startGame("cpu");
  else if(act==="2p")startGame("2p");
  else if(act==="again")startGame(S.mode);
  else if(act==="menu"){showMenu();}
  else if(act==="resume"){overlay.classList.remove("show");updateActionUI();}
});

/*================ INIT ================*/
buildTiles();
defsOnce();
buildDice();
S.players=newPlayers();
S.layout=genLayout();
buildCreatures(false);
syncTileIcons();
buildPieces();
syncHUD();
idleDie();
layout();
requestAnimationFrame(fxLoop);
showMenu();
/* keep pieces glued on resize */
window.addEventListener("resize",function(){layout();});

/* headless / console hook */
window.snakesLadders={
  state:S, tileU:tileU, buildPath:buildPath, genLayout:genLayout,
  effectAt:effectAt, resolveLanding:resolveLanding, makeTrack:makeTrack,
  snakeGeo:snakeGeo, ladderGeo:ladderGeo, SFX:SFX,
  startGame:function(m){startGame(m||"cpu");},
  showMenu:showMenu
};
})();
</script>
