<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Bejeweled 3D</title>
<style>
:root{
  --text:#eef0fa;
  --dim:#98a0c3;
  --panel:rgba(23,27,46,.92);
  --line:rgba(255,255,255,.09);
  --accent:#7c5cff;
  --accent2:#00d4a6;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;overflow:hidden;color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(900px 600px at 20% -10%, rgba(124,92,255,.28), transparent 60%),
    radial-gradient(800px 600px at 85% 110%, rgba(0,212,166,.18), transparent 55%),
    #0a0d1a;
  user-select:none;-webkit-user-select:none;
}
/* ---------- starfield ---------- */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star-layer{position:absolute;inset:-550px 0 0 0;background-repeat:repeat;animation:starFall linear infinite}
@keyframes starFall{to{transform:translateY(550px)}}
.l1{background-image:
  radial-gradient(1.4px 1.4px at 23px 61px, #fff, transparent 100%),
  radial-gradient(1.6px 1.6px at 120px 160px, rgba(255,255,255,.85), transparent 100%),
  radial-gradient(1.3px 1.3px at 210px 40px, rgba(255,255,255,.7), transparent 100%),
  radial-gradient(1.8px 1.8px at 300px 220px, rgba(255,255,255,.9), transparent 100%),
  radial-gradient(1.4px 1.4px at 390px 300px, rgba(255,255,255,.65), transparent 100%),
  radial-gradient(1.6px 1.6px at 80px 330px, rgba(255,255,255,.8), transparent 100%),
  radial-gradient(1.5px 1.5px at 460px 120px, rgba(255,255,255,.75), transparent 100%);
  background-size:520px 550px;animation-duration:150s;opacity:.55}
.l2{background-image:
  radial-gradient(2px 2px at 60px 100px, #cfe0ff, transparent 100%),
  radial-gradient(2.2px 2.2px at 250px 240px, rgba(180,200,255,.8), transparent 100%),
  radial-gradient(2px 2px at 420px 60px, rgba(255,255,255,.7), transparent 100%);
  background-size:550px 550px;animation-duration:95s;opacity:.4}
.l3{background-image:
  radial-gradient(2.6px 2.6px at 140px 180px, #ffd9f0, transparent 100%),
  radial-gradient(2.8px 2.8px at 360px 330px, rgba(255,217,240,.8), transparent 100%);
  background-size:550px 550px;animation-duration:60s;opacity:.35}
.shard{position:fixed;width:56px;height:56px;z-index:0;pointer-events:none;
  background:linear-gradient(135deg,#5a3df0,#00d4a6);
  transform:rotate(45deg);border-radius:14px;filter:blur(6px);opacity:.16;
  animation:shardFloat 14s ease-in-out infinite alternate}
.shard.s2{width:38px;height:38px;background:linear-gradient(135deg,#ff3355,#ffd166);filter:blur(8px);animation-duration:18s;animation-delay:-6s}
.shard.s3{width:26px;height:26px;background:linear-gradient(135deg,#38b6ff,#b96bff);filter:blur(5px);animation-duration:11s;animation-delay:-3s}
@keyframes shardFloat{from{transform:translateY(0) rotate(45deg)}to{transform:translateY(-60px) rotate(125deg)}}

/* ---------- layout ---------- */
#stage{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:13px;touch-action:none}
.title{margin:0;font-size:1.9rem;letter-spacing:1px;line-height:1.1;
  background:linear-gradient(90deg,#9d7bff 0%,#00d4a6 55%,#5ac8ff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
/* HUD */
#hud{width:var(--board,400px);display:flex;align-items:center;gap:9px;padding:9px 13px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 12px 34px rgba(0,0,0,.45)}
#hud.liveshit{animation:shake .45s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px)}40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}80%{transform:translateX(3px)}
}
.lives{display:flex;gap:4px;font-size:1.05rem;white-space:nowrap}
.heart{filter:drop-shadow(0 0 5px rgba(255,77,109,.6));transition:opacity .3s,transform .3s}
.heart.off{opacity:.18;filter:none;transform:scale(.8)}
.stat{display:flex;flex-direction:column;align-items:center;gap:1px;white-space:nowrap}
.stat .lbl{font-size:.56rem;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.stat .val{font-size:.98rem;font-weight:700;font-variant-numeric:tabular-nums}
#scoreVal{color:#8ffce0}
#movesVal.low{color:#ff7b8a;animation:lowPulse 1s ease-in-out infinite}
@keyframes lowPulse{0%,100%{opacity:1}50%{opacity:.45}}
.prog{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;min-width:24px}
#progFill{height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  box-shadow:0 0 10px rgba(0,212,166,.5);transition:width .4s ease}
.lvl{background:rgba(124,92,255,.18);border:1px solid rgba(124,92,255,.5);color:#cbb9ff;
  padding:5px 11px;border-radius:99px;font-size:.75rem;font-weight:700;white-space:nowrap}
/* board */
#boardWrap{position:relative}
#toast{position:absolute;left:50%;top:-40px;transform:translateX(-50%) translateY(8px);
  background:rgba(0,212,166,.15);border:1px solid rgba(0,212,166,.55);color:#8ffce0;
  padding:6px 16px;border-radius:99px;font-size:.8rem;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;white-space:nowrap;z-index:10}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.board-glow{position:absolute;inset:-44px;background:radial-gradient(closest-side,rgba(124,92,255,.32),transparent 72%);
  filter:blur(12px);z-index:0;pointer-events:none}
#board{position:relative;width:var(--board,400px);height:var(--board,400px);z-index:1;
  background:linear-gradient(180deg,rgba(30,36,64,.92),rgba(16,20,38,.95));
  border:1px solid var(--line);border-radius:16px;touch-action:none;
  box-shadow:0 45px 90px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);cursor:default}
#cells,#gems{position:absolute;inset:0}
#gems{z-index:2}
.cell{position:absolute;left:0;top:0;width:var(--cell,48px);height:var(--cell,48px);border-radius:10px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(0,0,0,.32));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), inset 0 -3px 8px rgba(0,0,0,.28)}
/* gems — .gem carries POSITION only; all cosmetic animation lives on .gem-core */
.gem{position:absolute;left:0;top:0;width:var(--cell,48px);height:var(--cell,48px);
  z-index:2;will-change:transform}
.gem-core{position:absolute;inset:7%;border-radius:16%;
  animation:idle 3.4s ease-in-out infinite alternate;animation-delay:var(--idle,0s)}
.gem svg{width:100%;height:100%;display:block;overflow:visible;
  filter:drop-shadow(0 5px 7px rgba(0,0,0,.5))}
@keyframes idle{from{transform:rotate(-3.5deg)}to{transform:rotate(3.5deg) translateY(-1.5px)}}
.gem:hover .gem-core{animation:none;transform:translateY(-6px) scale(1.1)}
.gem.sel{z-index:6}
.gem.sel .gem-core{animation:none;transform:scale(1.08);
  filter:drop-shadow(0 0 10px rgba(255,255,255,.85)) brightness(1.15)}
.gem.near .gem-core{box-shadow:0 0 0 2px rgba(255,255,255,.30), 0 5px 7px rgba(0,0,0,.5)}
.gem.hint .gem-core{animation:hintPulse .9s ease-in-out infinite}
.gem.hint svg{filter:drop-shadow(0 0 12px rgba(0,212,166,.9)) drop-shadow(0 5px 7px rgba(0,0,0,.5))}
@keyframes hintPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.gem.pop{z-index:8;pointer-events:none}
.gem.pop .gem-core{animation:pop .5s ease-in forwards}
@keyframes pop{
  0%{transform:scale(1);opacity:1}
  35%{transform:scale(1.45) rotate(9deg);filter:brightness(2.2)}
  100%{transform:scale(0);opacity:0}
}
.gem.forming .gem-core{animation:form .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes form{
  0%{transform:scale(0) rotate(-200deg);filter:brightness(2.5)}
  70%{transform:scale(1.18)}
  100%{transform:scale(1)}
}
.spark{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;
  border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%);
  opacity:0;pointer-events:none;z-index:9}
.gem.pop .spark{animation:spark .55s ease-out forwards}
@keyframes spark{
  0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--sx,12px),var(--sy,-16px)) scale(2.6)}
}
/* special badges */
.badge{position:absolute;left:50%;top:50%;width:56%;height:56%;
  transform:translate(-50%,-50%);pointer-events:none}
.badge svg{width:100%;height:100%;overflow:visible;
  filter:drop-shadow(0 0 6px rgba(255,255,255,.7));
  animation:badgePulse 1.1s ease-in-out infinite alternate}
@keyframes badgePulse{from{transform:scale(1)}to{transform:scale(1.12)}}
.badge.ring{background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%);
  border:2.5px solid rgba(255,255,255,.85);border-radius:50%;
  animation:badgePulse 1.1s ease-in-out infinite alternate}
/* controls + tip */
#controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;
  padding:8px 14px;font-size:.78rem;font-family:inherit;cursor:pointer;
  transition:all .15s;text-decoration:none;display:inline-block}
.btn:hover{border-color:rgba(124,92,255,.6);transform:translateY(-2px)}
.btn:disabled{opacity:.35;pointer-events:none;transform:none}
.btn-primary{background:linear-gradient(90deg,var(--accent),#5a3df0);border:none;color:#fff;font-weight:600}
.tip{margin:0;font-size:.68rem;color:var(--dim);text-align:center;line-height:1.5}
/* no-anim helper (resize / reshuffle jumps) */
.noanim .gem,.noanim .cell,.noanim .gem-core{transition:none!important;animation:none!important}
/* modal */
#modalWrap{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:rgba(5,7,15,.72);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s}
#modalWrap.show{opacity:1;pointer-events:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 40px;
  text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6);transform:scale(.94);transition:transform .3s;min-width:250px}
#modalWrap.show .modal{transform:scale(1)}
.modal-emoji{font-size:2.6rem;line-height:1}
.modal h2{margin:8px 0 4px;font-size:1.5rem}
.modal p{margin:0 0 18px;color:var(--dim)}
.modal-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="stars"><div class="star-layer l1"></div><div class="star-layer l2"></div><div class="star-layer l3"></div></div>
<div class="shard" style="left:8%;top:18%"></div>
<div class="shard s2" style="right:10%;top:62%"></div>
<div class="shard s3" style="left:16%;bottom:10%"></div>

<div id="stage">
  <h1 class="title" id="title">✦ Bejeweled ✦</h1>

  <div id="hud">
    <div class="lives" id="lives"></div>
    <div class="stat"><span class="lbl">Score</span><span class="val" id="scoreVal">0</span></div>
    <div class="stat"><span class="lbl">Moves</span><span class="val" id="movesVal">20</span></div>
    <div class="prog"><div id="progFill"></div></div>
    <div class="stat"><span class="lbl">Target</span><span class="val" id="targetVal">500</span></div>
    <div class="lvl" id="lvl">Lv 1</div>
  </div>

  <div id="boardWrap">
    <div id="toast"></div>
    <div class="board-glow"></div>
    <div id="board">
      <div id="cells"></div>
      <div id="gems"></div>
    </div>
  </div>

  <div id="controls">
    <button class="btn" id="btnHint" type="button">💡 Hint</button>
    <button class="btn" id="btnShuffle" type="button">🔀 Shuffle</button>
    <button class="btn" id="btnMute" type="button">🔊 Sound</button>
    <button class="btn" id="btnRestart" type="button">↻ Restart</button>
    <button class="btn" id="btnFull" type="button">⛶ Fullscreen</button>
  </div>
  <p class="tip" id="tip">Drag a gem or tap two adjacent gems to swap · 4 in a row → 💣 bomb · 5 in a row → ⚡ jet · L/T shape → 🌈 rainbow (swap it with a color to clear it all)</p>
</div>

<div id="modalWrap">
  <div class="modal">
    <div class="modal-emoji" id="modalEmoji">💔</div>
    <h2 id="modalTitle">Game Over</h2>
    <p id="modalText"></p>
    <div class="modal-actions">
      <button class="btn btn-primary" id="btnAgain" type="button">Play again</button>
      <a class="btn" href="../../index.html" target="_top">Back to portal</a>
    </div>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
 * Bejeweled — core rules (pure data, no DOM).
 * The board is an N×N grid; every cell is always a gem at rest.
 * ========================================================================= */
const N = 8;
const TYPES = 6;
const SWAP_MS = 170;
const POP_MS = 480;

const S = {
  grid: emptyGrid(),   // S.grid[r][c] = gem | null   (gem: {t, sp, r, c, ...})
  score: 0, shown: 0,
  level: 1, moves: 0, lives: 3,
  busy: true, over: false,
  sel: null, uid: 0, gen: 0,
};

const target   = lv => 250 * lv * (lv + 1);          // cumulative score target per level
const movesFor = lv => Math.min(20 + 2 * (lv - 1), 40);
const randType = () => (Math.random() * TYPES) | 0;
const sleep = ms => new Promise(res => setTimeout(res, ms));

function emptyGrid(){ const g = []; for (let r = 0; r < N; r++) g.push(new Array(N).fill(null)); return g; }
function allGems(){
  const a = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){ const g = S.grid[r][c]; if (g) a.push(g); }
  return a;
}
function isFull(){
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!S.grid[r][c]) return false;
  return true;
}

/* ---------- runs ---------- */
/* run = {h, a, b, len}:  h → row a, cols b..b+len-1 ;  !h → col a, rows b..b+len-1 */
function findRuns(){
  const runs = [];
  for (let r = 0; r < N; r++){
    let c = 0;
    while (c < N){
      const g = S.grid[r][c];
      if (!g || g.t < 0){ c++; continue; }
      let c2 = c + 1;
      while (c2 < N){ const h = S.grid[r][c2]; if (!h || h.t !== g.t) break; c2++; }
      if (c2 - c >= 3) runs.push({ h: true, a: r, b: c, len: c2 - c });
      c = c2;
    }
  }
  for (let c = 0; c < N; c++){
    let r = 0;
    while (r < N){
      const g = S.grid[r][c];
      if (!g || g.t < 0){ r++; continue; }
      let r2 = r + 1;
      while (r2 < N){ const h = S.grid[r2][c]; if (!h || h.t !== g.t) break; r2++; }
      if (r2 - r >= 3) runs.push({ h: false, a: c, b: r, len: r2 - r });
      r = r2;
    }
  }
  return runs;
}
function runCells(run){
  const cells = [];
  for (let i = 0; i < run.len; i++) cells.push(run.h ? S.grid[run.a][run.b + i] : S.grid[run.b + i][run.a]);
  return cells;
}

/* ---------- moving two gems around ---------- */
function swapData(a, b){
  const ar = a.r, ac = a.c;
  a.r = b.r; a.c = b.c;
  b.r = ar; b.c = ac;
  S.grid[a.r][a.c] = a;
  S.grid[b.r][b.c] = b;
}

/* does placing gem g (already at its new cell) complete a 3-run? */
function createsMatch(g){
  const t = g.t;
  if (t < 0) return false;
  let h = 1;
  for (let c = g.c - 1; c >= 0 && S.grid[g.r][c] && S.grid[g.r][c].t === t; c--) h++;
  for (let c = g.c + 1; c < N  && S.grid[g.r][c] && S.grid[g.r][c].t === t; c++) h++;
  if (h >= 3) return true;
  let v = 1;
  for (let r = g.r - 1; r >= 0 && S.grid[r][g.c] && S.grid[r][g.c].t === t; r--) v++;
  for (let r = g.r + 1; r < N  && S.grid[r][g.c] && S.grid[r][g.c].t === t; r++) v++;
  return v >= 3;
}

function findMove(){
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
    const a = S.grid[r][c];
    if (!a) continue;
    const dirs = [[0,1],[1,0]];
    for (const [dr, dc] of dirs){
      const nr = r + dr, nc = c + dc;
      if (nr >= N || nc >= N) continue;
      const b = S.grid[nr][nc];
      if (!b) continue;
      if (a.sp || b.sp) return [a, b];            // a special can always be activated
      swapData(a, b);
      const ok = createsMatch(a) || createsMatch(b);
      swapData(a, b);
      if (ok) return [a, b];
    }
  }
  return null;
}

/* ---------- resolution planning ---------- */
function blastCells(g){
  const out = [];
  if (g.sp === "bomb"){
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++){
      const r = g.r + dr, c = g.c + dc;
      if (r < 0 || c < 0 || r >= N || c >= N) continue;
      out.push(S.grid[r][c]);
    }
  } else if (g.sp === "jet"){
    for (let c = 0; c < N; c++) out.push(S.grid[g.r][c]);
    for (let r = 0; r < N; r++){ const x = S.grid[r][g.c]; if (!out.includes(x)) out.push(x); }
  } else if (g.sp === "rainbow"){
    if (g._rb != null){
      for (const h of allGems()) if (h.t === g._rb) out.push(h);
    } else {
      for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++){
        const r = g.r + dr, c = g.c + dc;
        if (r < 0 || c < 0 || r >= N || c >= N) continue;
        out.push(S.grid[r][c]);
      }
    }
  }
  return out;
}

/*
 * Decide what one resolution step clears/creates, given the current runs and
 * (on the first step) the two gems the player just swapped.
 *  - specials the player moved → detonate
 *  - every run cell → cleared
 *  - run of 4 → a bomb survives at the moved gem (or middle); run of 5+ → a jet
 *  - a cell shared by a horizontal AND a vertical run (L/T) → rainbow orb
 *  - any surviving special caught in a blast → chain-detonate
 */
function planResolution(runs, swA, swB){
  const clear = new Set();
  const spawned = [];

  if (swA && swA.sp) clear.add(swA);
  if (swB && swB.sp) clear.add(swB);
  // a rainbow swapped with a colored gem clears that color
  if (swA && swA.sp === "rainbow") swA._rb = (swB && swB.t >= 0) ? swB.t : null;
  if (swB && swB.sp === "rainbow") swB._rb = (swA && swA.t >= 0) ? swA.t : null;

  for (const run of runs) for (const g of runCells(run)) clear.add(g);

  // line specials
  const spawnCell = new Map();
  for (const run of runs){
    let sp = null;
    if (run.len >= 5) sp = "jet";
    else if (run.len === 4) sp = "bomb";
    if (!sp) continue;
    const cells = runCells(run);
    // prefer the gem the player just moved — unless it is a special (it detonates instead)
    let cell = null;
    if (swA && !swA.sp && cells.includes(swA)) cell = swA.r * N + swA.c;
    else if (swB && !swB.sp && cells.includes(swB)) cell = swB.r * N + swB.c;
    else {
      const mid = cells[run.len >> 1];
      if (mid) cell = mid.r * N + mid.c;
    }
    if (cell != null) spawnCell.set(cell, sp);
  }
  // L / T intersections become a rainbow (takes priority over line specials)
  const at = new Map();
  for (const run of runs) for (const g of runCells(run)){
    const k = g.r * N + g.c;
    if (!at.has(k)) at.set(k, []);
    at.get(k).push(run);
  }
  for (const [k, list] of at){
    if (!(list.some(x => x.h) && list.some(x => !x.h))) continue;
    const g = S.grid[(k / N) | 0][k % N];
    if (!g) continue;
    if ((g === swA || g === swB) && g.sp) continue;   // swapped special keeps its identity
    spawnCell.set(k, "rainbow");
  }
  for (const [k, sp] of spawnCell){
    const g = S.grid[(k / N) | 0][k % N];
    if (!g || !clear.has(g)) continue;
    clear.delete(g);
    g.sp = sp;
    if (sp === "rainbow"){ g.t = -1; g._rb = null; }
    g._dn = 0;
    spawned.push(g);
  }

  // chain-detonate specials being cleared (freshly spawned ones are safe this step)
  const spawnedSet = new Set(spawned);
  const q = [];
  for (const g of clear) if (g.sp && !spawnedSet.has(g)) q.push(g);
  let guard = 0;
  while (q.length && guard++ < 128){
    const g = q.pop();
    if (g._dn) continue;
    g._dn = 1;
    for (const h of blastCells(g)){
      if (!h || clear.has(h)) continue;
      if (spawnedSet.has(h)) continue;   // freshly spawned: safe this step
      clear.add(h);
      if (h.sp) q.push(h);
    }
  }
  return { clear, spawned };
}

/* point values for a gem being cleared */
function gemValue(g){
  return g.sp === "rainbow" ? 200 : g.sp === "jet" ? 100 : g.sp === "bomb" ? 50 : 10;
}

/* apply a plan to the grid (pure) and return the base points */
function clearData(plan){
  let pts = 0;
  for (const g of plan.clear){
    S.grid[g.r][g.c] = null;
    pts += gemValue(g);
  }
  return pts;
}

/* gravity: pack each column down, spawn replacements above the top edge.
 * Returns {moves:[{g,drop}], spawns:[{g,dist}]} and updates S.grid. */
function gravityData(factory){
  const moves = [], spawns = [];
  for (let c = 0; c < N; c++){
    let w = N - 1;
    for (let r = N - 1; r >= 0; r--){
      const g = S.grid[r][c];
      if (!g) continue;
      if (w !== r){
        S.grid[w][c] = g;
        S.grid[r][c] = null;
        moves.push({ g, drop: w - r });
        g.r = w;
      }
      w--;
    }
    const n = w + 1;
    for (let r = w; r >= 0; r--){
      const g = factory(randType(), r, c);
      S.grid[r][c] = g;
      spawns.push({ g, dist: n });   // all new gems in the column fall n rows
    }
  }
  return { moves, spawns };
}

/* fill the grid with random gems that form no immediate runs (and at least one move).
 * onRetry (optional) is called before each rebuild attempt so the view can clean up. */
function buildGridNoMatches(factory, onRetry){
  for (let attempt = 0; attempt < 200; attempt++){
    S.grid = emptyGrid();
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
      let t;
      do { t = randType(); }
      while ((c >= 2 && S.grid[r][c-1] && S.grid[r][c-1].t === t && S.grid[r][c-2].t === t) ||
             (r >= 2 && S.grid[r-1][c] && S.grid[r-1][c].t === t && S.grid[r-2][c].t === t));
      S.grid[r][c] = factory(t, r, c);
    }
    if (!findRuns().length && findMove()) return true;
    if (onRetry) onRetry();
  }
  return false; // pathologically unlucky; caller can live with it or reshuffle
}

/* safety net: any null cell gets a gem (the grid must always be full at rest) */
function normalizeGrid(factory){
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
    if (!S.grid[r][c]) S.grid[r][c] = factory(randType(), r, c);
  }
}

/* ---------- layout (board always fits, always fills) ---------- */
let CELL = 48, GAP = 4, PAD = 6, PITCH = 52, BOARD = 400;
const GAP_F = 0.08, PAD_F = 0.13;

function layout(){
  const reserve =
    $("#title").offsetHeight + hudEl.offsetHeight +
    $("#controls").offsetHeight + $("#tip").offsetHeight + 82;
  const avail = Math.max(150, Math.min(window.innerWidth - 28, window.innerHeight - reserve));
  const k = N + (N - 1) * GAP_F + 2 * PAD_F;
  CELL = Math.max(26, Math.min(66, Math.floor(avail / k)));
  GAP = Math.round(CELL * GAP_F);
  PAD = Math.round(CELL * PAD_F);
  PITCH = CELL + GAP;
  BOARD = PAD * 2 + N * CELL + (N - 1) * GAP;

  const st = stageEl.style;
  st.setProperty("--cell", CELL + "px");
  st.setProperty("--board", BOARD + "px");

  boardEl.classList.add("noanim");
  boardEl.style.width = BOARD + "px";
  boardEl.style.height = BOARD + "px";
  hudEl.style.width = BOARD + "px";
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) posCell(r, c);
  for (const g of allGems()) posGem(g, 0);
  void boardEl.offsetWidth;
  boardEl.classList.remove("noanim");
}

/* ---------- gem artwork ---------- */
const COLORS = [
  { stops: ["#ffc2cc", "#ff4d6d", "#7e0e2d"] },   // ruby
  { stops: ["#c9e8ff", "#3d9bff", "#0b3d91"] },   // sapphire
  { stops: ["#c9ffe0", "#2fe381", "#0a6b38"] },   // emerald
  { stops: ["#e8ccff", "#a44dff", "#4a1285"] },   // amethyst
  { stops: ["#ffe9b3", "#ffb703", "#8a5306"] },   // topaz

];
const RAINBOW_COLS = ["#ff4d6d", "#3d9bff", "#2fe381", "#a44dff", "#ffb703", "#e8f1ff"];

function gemSVG(g){
  const [lt, mid, dk] = COLORS[g.t].stops;
  const id = "gr" + g.uid;
  const lines = [
    [50,3,50,26],[87,14,78,50],[97,50,78,50],[87,86,50,74],

<polygon points="50,3 87,14 97,50 87,86 50,97 13,86 3,50 13,14" fill="url(#${id})" stroke="rgba(255,255,255,.55)" stroke-width="2.5" stroke-linejoin="round"/>

function rainbowSVG(g){
  let arcs = "";
  for (let i = 0; i < 6; i++){
    const a0 = (i * 60 - 90) * Math.PI / 180;
    const a1 = (i * 60 - 90 + 50) * Math.PI / 180;

    const x1 = (50 + 30 * Math.cos(a1)).toFixed(1), y1 = (50 + 30 * Math.sin(a1)).toFixed(1);

  }
  return `<svg viewBox="0 0 100 100">
<defs><radialGradient id="rr${g.uid}" cx=".38" cy=".34" r=".8">

</radialGradient></defs>
<circle cx="50" cy="50" r="42" fill="url(#rr${g.uid})" stroke="rgba(255,255,255,.8)" stroke-width="2"/>
${arcs}

}
const BOMB_SVG = `<svg viewBox="0 0 100 100">
<circle cx="50" cy="56" r="25" fill="rgba(12,15,28,.55)" stroke="#fff" stroke-width="5"/>
<circle cx="50" cy="56" r="9" fill="#fff" opacity=".95"/>
<path d="M50 31 C 52 20, 60 18, 65 11" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
<circle cx="65" cy="11" r="4.5" fill="#ffd166"/>
<line x1="60" y1="5" x2="56" y2="0" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>
<line x1="70" y1="6" x2="75" y2="1" stroke="#ffd166" stroke-width="3" stroke-linecap="round"/>
</svg>`;
const JET_SVG = `<svg viewBox="0 0 100 100">
<circle cx="50" cy="50" r="30" fill="rgba(12,15,28,.55)" stroke="#fff" stroke-width="5"/>
<polygon points="56,24 38,54 49,54 42,76 64,44 52,44" fill="#fff"/>
</svg>`;

function renderGem(g){
  let badge = "";
  if (g.sp === "bomb") badge = `<div class="badge">${BOMB_SVG}</div>`;
  else if (g.sp === "jet") badge = `<div class="badge">${JET_SVG}</div>`;
  else if (g.sp === "rainbow") badge = `<div class="badge ring"></div>`;
  const art = g.sp === "rainbow" ? rainbowSVG(g) : gemSVG(g);
  g.el.innerHTML = `<div class="gem-core" style="--idle:${(-Math.random() * 3.4).toFixed(2)}s">${art}${badge}</div>`;
}

/* ---------- views / positioning ---------- */
function makeGem(t, r, c, sp){
  const el = document.createElement("div");
  el.className = "gem";
  gemsEl.appendChild(el);
  const g = { t, sp: sp || null, r, c, el, uid: S.uid++, _dn: 0 };
  renderGem(g);
  posGem(g, 0);
  return g;
}
function posGem(g, rowOffset = 0){
  if (!g.el) return;
  const x = PAD + g.c * PITCH;
  const y = PAD + (g.r + rowOffset) * PITCH;
  g.el.style.transform = `translate3d(${x}px,${y}px,0)`;
}
function fallTo(g, rowOffset, ms, delay = 0){
  g.el.style.transition = `transform ${ms}ms cubic-bezier(.3,1.18,.42,1) ${delay}ms`;
  posGem(g, rowOffset);
}
const fallDur = d => Math.min(90 + d * 55, 460);

const cellEls = [];
function buildCells(){
  for (let r = 0; r < N; r++){
    cellEls.push([]);
    for (let c = 0; c < N; c++){
      const d = document.createElement("div");
      d.className = "cell";
      cellsEl.appendChild(d);
      cellEls[r].push(d);
      posCell(r, c);
    }
  }
}
function posCell(r, c){
  const d = cellEls[r] && cellEls[r][c];
  if (!d) return;
  d.style.transform = `translate3d(${PAD + c * PITCH}px,${PAD + r * PITCH}px,0)`;
}

function popOut(g){
  g.el.classList.add("pop");
  for (let i = 0; i < 5; i++){
    const s = document.createElement("i");
    s.className = "spark";
    const a = Math.random() * Math.PI * 2;
    s.style.setProperty("--sx", (Math.cos(a) * 26).toFixed(0) + "px");
    s.style.setProperty("--sy", (Math.sin(a) * 26).toFixed(0) + "px");
    s.style.left = (30 + Math.random() * 40) + "%";
    s.style.top  = (30 + Math.random() * 40) + "%";
    g.el.appendChild(s);
  }
  setTimeout(() => g.el.remove(), POP_MS + 90);
}

function applyGravity(grav){
  let maxMs = 0;
  const pending = [];
  for (const m of grav.moves){
    const ms = fallDur(m.drop);
    maxMs = Math.max(maxMs, ms);
    fallTo(m.g, 0, ms);
  }
  for (const s of grav.spawns){
    const ms = fallDur(s.dist);
    maxMs = Math.max(maxMs, ms);
    s.g.el.style.transition = "none";
    posGem(s.g, -s.dist);
    pending.push({ g: s.g, ms });
  }
  for (const p of pending) void p.g.el.offsetWidth;   // flush start positions
  for (const p of pending) fallTo(p.g, 0, p.ms);
  return maxMs;
}
function normalizeView(){
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
    if (!S.grid[r][c]){
      S.grid[r][c] = makeGem(randType(), r, c);
    }
  }
}

/* ---------- audio ---------- */
const SFX = (() => {
  let ac = null, muted = false;
  try { muted = localStorage.getItem("bejeweled-mute") === "1"; } catch (e) {}
  function ctx(){
    if (muted) return null;
    if (!ac){ try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  function tone(f, dur, type = "sine", vol = 0.12, delay = 0, slide = 0){
    const a = ctx(); if (!a) return;
    const t0 = a.currentTime + delay;
    const o = a.createOscillator(), gn = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(30, f), t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + dur);
    gn.gain.setValueAtTime(0.0001, t0);
    gn.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gn); gn.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.06);
  }
  return {
    get muted(){ return muted; },
    toggle(){
      muted = !muted;
      try { localStorage.setItem("bejeweled-mute", muted ? "1" : "0"); } catch (e) {}
      if (!muted) tone(660, 0.08, "triangle", 0.1);
    },
    unlock(){ ctx(); },
    swap(){ tone(340, 0.09, "triangle", 0.1, 0, 140); },
    bad(){ tone(150, 0.28, "sawtooth", 0.08, 0, -70); },
    match(n, step){
      const base = 300 * Math.pow(1.13, Math.min(step, 10));
      const count = n > 8 ? 5 : 3;
      for (let i = 0; i < count; i++) tone(base * Math.pow(2, [0,4,7,12,16][i] / 12), 0.13, "triangle", 0.09, i * 0.055);
    },
    boom(){ tone(90, 0.4, "sawtooth", 0.15, 0, -50); tone(55, 0.5, "sine", 0.15); },
    rainbow(){ [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.18, "triangle", 0.08, i * 0.06)); },
    level(){ [523, 659, 784, 1046, 1318, 1568].forEach((f, i) => tone(f, 0.16, "triangle", 0.1, i * 0.09)); },
    over(){ [392, 330, 262, 196, 147].forEach((f, i) => tone(f, 0.32, "sawtooth", 0.07, i * 0.17)); },
  };
})();

/* ---------- HUD / feedback ---------- */
let toastTimer = 0;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1500);
}
function addScore(n){ S.score += n; }
function updateHud(){
  livesEl.innerHTML = "";
  for (let i = 0; i < 3; i++){
    const s = document.createElement("span");
    s.className = "heart" + (i < S.lives ? "" : " off");
    s.textContent = "♥";
    livesEl.appendChild(s);
  }
  movesEl.textContent = S.moves;
  movesEl.classList.toggle("low", S.moves <= 5 && !S.over);
  const t0 = target(S.level - 1), t1 = target(S.level);
  progFill.style.width = (Math.max(0, Math.min(1, (S.score - t0) / (t1 - t0))) * 100).toFixed(1) + "%";
  targetEl.textContent = t1.toLocaleString();
  lvlEl.textContent = "Lv " + S.level;
}
let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.shown !== S.score){
    S.shown += (S.score - S.shown) * Math.min(1, dt * 9);
    if (Math.abs(S.score - S.shown) < 1) S.shown = S.score;
    scoreEl.textContent = Math.round(S.shown).toLocaleString();
  }
  requestAnimationFrame(loop);
}

/* ---------- board lifecycle ---------- */
async function newBoard(){
  const gen = S.gen;
  S.busy = true;
  S.sel = null;
  const gs = allGems();
  for (const g of gs) popOut(g);
  if (gs.length) await sleep(POP_MS + 40);
  if (S.gen !== gen) return;
  gemsEl.innerHTML = "";
  S.grid = emptyGrid();
  buildGridNoMatches(makeGem, () => { gemsEl.innerHTML = ""; });
  if (S.gen !== gen) return;
  const fresh = allGems();
  for (const g of fresh){ g.el.style.transition = "none"; posGem(g, -(N + 1)); }
  void gemsEl.offsetWidth;
  for (const g of fresh) fallTo(g, 0, fallDur(N + 1), g.c * 16);
  await sleep(fallDur(N + 1) + N * 16 + 60);
  if (S.gen !== gen) return;
}

async function newGame(){
  S.gen++;
  const gen = S.gen;
  S.score = 0; S.shown = 0; S.level = 1; S.lives = 3;
  S.moves = movesFor(1); S.over = false; S.sel = null;
  modalWrap.classList.remove("show");
  updateHud();
  await newBoard();
  if (S.gen === gen && !S.over) S.busy = false;
}

/* ---------- cascade resolution (visual side of planResolution/clearData/gravityData) ---------- */
async function resolveBoard(runs, swA, swB){
  const gen = S.gen;
  let step = 0, guard = 0;
  for (;;){
    if (S.gen !== gen) return;
    const plan = planResolution(runs || [], step === 0 ? swA : null, step === 0 ? swB : null);
    if (!plan.clear.size || guard++ > 40) break;
    step++;

    addScore(clearData(plan) * Math.min(step, 5));

    let fx = null;
    for (const g of plan.clear){
      if (g.sp === "rainbow") fx = "rainbow";
      else if (g.sp === "jet") fx = fx || "jet";
      else if (g.sp === "bomb") fx = fx || "boom";
      popOut(g);
    }
    for (const g of plan.spawned){
      renderGem(g);
      g.el.classList.add("forming");
      setTimeout(() => g.el.classList.remove("forming"), 700);
    }
    SFX.match(plan.clear.size, step);
    if (fx === "rainbow") SFX.rainbow();
    else if (fx === "jet" || fx === "boom") SFX.boom();
    if (step >= 2) toast("Combo ×" + Math.min(step, 5));

    await sleep(POP_MS);
    if (S.gen !== gen) return;
    const grav = gravityData(makeGem);
    const ms = applyGravity(grav);
    normalizeView();
    await sleep(ms + 50);
    if (S.gen !== gen) return;

    runs = findRuns();
    if (!runs.length) break;
  }
  if (!findMove()) await autoReshuffle(false);
}

/* reshuffle all gems until there are no instant matches and at least one move */
async function autoReshuffle(manual){
  const gen = S.gen;
  if (!manual) toast("No moves — reshuffling");
  SFX.swap();
  const gs = allGems();
  if (!gs.length) return;
  const cells = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) cells.push([r, c]);
  let ok = false;
  for (let i = 0; i < 400 && !ok; i++){
    for (let j = gs.length - 1; j > 0; j--){
      const k = (Math.random() * (j + 1)) | 0;
      [gs[j], gs[k]] = [gs[k], gs[j]];
    }
    for (let j = 0; j < cells.length; j++){
      const g = gs[j];
      g.r = cells[j][0]; g.c = cells[j][1];
      S.grid[g.r][g.c] = g;
    }
    ok = !findRuns().length && !!findMove();
  }
  if (!ok){ await newBoard(); return; }
  if (S.gen !== gen) return;
  for (const g of gs){ g.el.style.transition = "none"; posGem(g, 0); }
  void boardEl.offsetWidth;
  for (const g of gs) fallTo(g, 0, 480 + Math.random() * 160);
  await sleep(700);
  if (S.gen !== gen) return;
  const rr = findRuns();
  if (rr.length) await resolveBoard(rr, null, null);
}

/* ---------- swapping ---------- */
async function trySwap(a, b){
  if (S.busy || S.over) return;
  if (!a || !b) return;
  if (Math.abs(a.r - b.r) + Math.abs(a.c - b.c) !== 1) return;
  const gen = S.gen;
  S.busy = true;
  clearSel();
  SFX.swap();
  swapData(a, b);
  fallTo(a, 0, SWAP_MS, 0);
  fallTo(b, 0, SWAP_MS, 0);
  await sleep(SWAP_MS + 30);
  if (S.gen !== gen) return;

  const runs = findRuns();
  if (runs.length || a.sp || b.sp){
    S.moves--;
    addScore(5);
    await resolveBoard(runs, a, b);
  } else {
    SFX.bad();
    swapData(a, b);
    fallTo(a, 0, SWAP_MS, 0);
    fallTo(b, 0, SWAP_MS, 0);
    await sleep(SWAP_MS + 30);
  }
  if (S.gen !== gen) return;
  await afterMove();
}

async function afterMove(){
  const gen = S.gen;
  updateHud();
  if (S.gen !== gen) return;
  if (S.moves > 0 || S.over){ S.busy = false; return; }

  if (S.score >= target(S.level)){
    S.level++;
    S.lives = 3;
    S.moves = movesFor(S.level);
    SFX.level();
    toast("Level " + S.level + "!");
    updateHud();
    await newBoard();
  } else {
    S.lives--;
    hudEl.classList.remove("liveshit"); void hudEl.offsetWidth; hudEl.classList.add("liveshit");
    updateHud();
    if (S.lives <= 0){ gameOver(); return; }
    S.moves = movesFor(S.level);
    SFX.bad();
    toast("Out of moves — one more go!");
    updateHud();
    await newBoard();
  }
  if (S.gen !== gen) return;
  S.busy = false;
}

function getBest(){ try { return +localStorage.getItem("bejeweled-best") || 0; } catch (e) { return 0; } }
function setBest(v){ try { localStorage.setItem("bejeweled-best", String(v)); } catch (e) {} }

function gameOver(){
  S.over = true;
  S.busy = false;
  SFX.over();
  const prev = getBest();
  const isBest = S.score > prev;
  if (isBest) setBest(S.score);
  $("#modalEmoji").textContent = "💔";
  $("#modalTitle").textContent = "Game Over";
  $("#modalText").textContent =
    `Final score: ${S.score.toLocaleString()} · reached level ${S.level}` +
    (isBest ? "  ·  new best!" : `  ·  best ${Math.max(prev, S.score).toLocaleString()}`);
  modalWrap.classList.add("show");
}

/* ---------- selection / input ---------- */
function markNeighbors(g){
  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  for (const [dr, dc] of dirs){
    const r = g.r + dr, c = g.c + dc;
    if (r < 0 || c < 0 || r >= N || c >= N) continue;
    const h = S.grid[r][c];
    if (h && h.el) h.el.classList.add("near");
  }
}
function clearSel(){
  if (S.sel && S.sel.el) S.sel.el.classList.remove("sel");
  S.sel = null;
  for (const g of allGems()) if (g.el) g.el.classList.remove("near");
}
function cellFromEvent(e){
  const rect = boardEl.getBoundingClientRect();
  const x = e.clientX - rect.left - PAD;
  const y = e.clientY - rect.top - PAD;
  if (x < 0 || y < 0) return null;
  const c = Math.floor(x / PITCH);
  const r = Math.floor(y / PITCH);
  if (r < 0 || c < 0 || r >= N || c >= N) return null;
  return { r, c };
}

let drag = null;
boardEl.addEventListener("pointerdown", e => {
  SFX.unlock();
  if (S.busy || S.over) return;
  const cell = cellFromEvent(e);
  const g = cell ? S.grid[cell.r][cell.c] : null;
  if (!g) return;
  drag = { g, x0: e.clientX, y0: e.clientY, fired: false };
  try { boardEl.setPointerCapture(e.pointerId); } catch (err) {}
});
boardEl.addEventListener("pointermove", e => {
  if (!drag || drag.fired) return;
  const dx = e.clientX - drag.x0;
  const dy = e.clientY - drag.y0;
  if (Math.hypot(dx, dy) < CELL * 0.45) return;
  drag.fired = true;
  let tr = drag.g.r, tc = drag.g.c;
  if (Math.abs(dx) > Math.abs(dy)) tc += dx > 0 ? 1 : -1;
  else tr += dy > 0 ? 1 : -1;
  const n = (tr >= 0 && tc >= 0 && tr < N && tc < N) ? S.grid[tr][tc] : null;
  if (n) trySwap(drag.g, n);
  else posGem(drag.g, 0);
});
boardEl.addEventListener("pointerup", e => {
  const d = drag;
  drag = null;
  if (!d) return;
  if (d.fired) return;
  if (S.busy || S.over) return;
  const cell = cellFromEvent(e);
  const g = cell ? S.grid[cell.r][cell.c] : null;
  if (!g){ clearSel(); return; }
  if (S.sel === g){ clearSel(); return; }
  if (S.sel && Math.abs(S.sel.r - g.r) + Math.abs(S.sel.c - g.c) === 1){
    const a = S.sel;
    clearSel();
    trySwap(a, g);
  } else {
    clearSel();
    S.sel = g;
    g.el.classList.add("sel");
    markNeighbors(g);
  }
});
boardEl.addEventListener("pointercancel", () => { drag = null; });
window.addEventListener("pointerdown", () => { SFX.unlock(); }, { once: true });

/* ---------- controls ---------- */
$("#btnHint").addEventListener("click", () => {
  if (S.busy || S.over) return;
  const m = findMove();
  if (!m){ autoReshuffle(true); return; }
  for (const g of m){
    g.el.classList.add("hint");
    setTimeout(() => g.el && g.el.classList.remove("hint"), 2400);
  }
});
$("#btnShuffle").addEventListener("click", () => {
  if (S.busy || S.over) return;
  autoReshuffle(true);
});
function syncMuteBtn(){
  $("#btnMute").textContent = SFX.muted ? "🔇 Muted" : "🔊 Sound";
}
$("#btnMute").addEventListener("click", () => { SFX.toggle(); syncMuteBtn(); });
$("#btnRestart").addEventListener("click", () => newGame());
$("#btnFull").addEventListener("click", () => {
  if (!document.fullscreenElement){
    if (stageEl.requestFullscreen) stageEl.requestFullscreen().catch(() => {});
  } else document.exitFullscreen();
});
$("#btnAgain").addEventListener("click", () => newGame());
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "h") $("#btnHint").click();
  else if (k === "s") $("#btnShuffle").click();
  else if (k === "m") $("#btnMute").click();
  else if (k === "f") $("#btnFull").click();
});

/* ---------- boot ---------- */
buildCells();
layout();
syncMuteBtn();
requestAnimationFrame(loop);
newGame();

} // end browser-only block

/* test hook (Node) — pure core, exported for automated rule tests */
if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    S, N, TYPES, target, movesFor,
    emptyGrid, allGems, isFull,
    findRuns, runCells, blastCells, planResolution, clearData, gemValue,
    gravityData, buildGridNoMatches, normalizeGrid, findMove, createsMatch, swapData, randType,
  };
}
</script>
